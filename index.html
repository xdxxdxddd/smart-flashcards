<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flashcards</title>
</head>
<body>
    <div id="app" style="text-align: center; font-family: sans-serif; padding-top: 50px;">
        <h1>Smart Flashcards 🗂️</h1>
        
        <button onclick="throwSentryError()" style="background: #e11d48; color: white; padding: 10px; border-radius: 5px; cursor: pointer;">
  Break the world
</button>

        <div style="margin-bottom: 20px;">
            <button id="btn-create" style="background: blue; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">➕ Створити нову картку</button>
        </div>

        <div id="card-container" style="border: 2px solid #333; border-radius: 15px; padding: 40px; width: 300px; margin: 20px auto; background: #f9f9f9;">
            <h2 id="card-question">Питання: Що таке CI/CD?</h2>
            <p>Рівень вивчення: <span id="current-level">1</span></p>
            
            <div style="margin-top: 20px;">
                <button id="btn-correct" style="background: green; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">Знаю</button>
                <button id="btn-incorrect" style="background: red; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Не знаю</button>
            </div>
        </div>

        <div id="env-status" style="margin-top: 20px; font-size: 0.8em; color: #666;">Завантаження...</div>
    </div>

    <!-- ЦЕЙ РЯДОК ПІДКЛЮЧАЄ ВСЮ ЛОГІКУ ТА POSTHOG -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
